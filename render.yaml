services:
  - type: web
    name: ofos-online-food-ordering-server
    runtime: docker
    plan: free
    rootDir: online-food-ordering-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ofos-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ofos-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ofos-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ofos-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ofos-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_ENABLED
        value: false

databases:
  - name: ofos-postgres
    plan: free
