services:
  - type: web
    name: ofos-online-food-ordering-server
    runtime: docker
    plan: free
    rootDir: online-food-ordering-server
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ofos-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_ENABLED
        value: false

databases:
  - name: ofos-postgres
    plan: free
