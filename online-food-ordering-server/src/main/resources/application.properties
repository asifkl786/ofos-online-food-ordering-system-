# =====================================================
# SPRING BOOT APPLICATION NAME
# =====================================================
spring.application.name=online-food-ordering-system

# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=${PORT:8080}
# IMPORTANT: Add context path for Swagger
server.servlet.context-path=/api/v1

# =====================================================
# DATABASE CONFIGURATION (PostgreSQL)
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/online_food_order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =====================================================
# SWAGGER / OPENAPI CONFIGURATION (CRITICAL FOR SWAGGER)
# =====================================================
# Enable Swagger UI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none

# Package to scan for controllers
springdoc.packages-to-scan=com.ofos.controller
springdoc.paths-to-match=/**

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
file.upload-dir=uploads/documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.root=INFO
logging.level.com.ofos=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/ofos.log

# Log pattern for console output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log rotation
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# =====================================================
# CORS CONFIGURATION
# =====================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:8080}

# =====================================================
# JWT CONFIGURATION
# =====================================================
app.jwt.secret=${JWT_SECRET:change-this-secret-before-running}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# =====================================================
# REDIS CONFIGURATION (REMOVED - Not using Redis anymore)
# =====================================================
# Redis configuration commented out - Using Database Sequence instead
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.timeout=2000ms
# spring.data.redis.lettuce.pool.max-active=8
# spring.data.redis.lettuce.pool.max-idle=8
# spring.data.redis.lettuce.pool.min-idle=0

# =====================================================
# RABBITMQ CONFIGURATION
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# =====================================================
# ACTUATOR CONFIGURATION (For monitoring)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =====================================================
# SPRING DEVTOOLS (For hot reload - optional)
# =====================================================
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# =====================================================
# JACKSON CONFIGURATION
# =====================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
#spring.jackson.default-property-inclusion=non_null

# =====================================================
# RAZORPAY CONFIGURATION
# =====================================================
# Get these from https://dashboard.razorpay.com/
razorpay.key.id=rzp_test_xxxxxxxxxxxxxx
razorpay.key.secret=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# =====================================================
# PLATFORM COMMISSION CONFIGURATION
# =====================================================
# 0.10 means 10% commission on net food value after coupon discount.
platform.commission.rate=0.10

# =====================================================
# EMAIL CONFIGURATION
# =====================================================
notification.email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:no-reply@example.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# SMS / WHATSAPP CONFIGURATION
# =====================================================
# Providers are disabled by default so local development does not fail without paid/vendor credentials.
# Add your provider API URL and credentials, then set the matching enabled flag to true.
notification.sms.enabled=false
notification.sms.api-url=
sms.api.key=your-msg91-api-key
sms.sender.id=OFOSOTP

notification.whatsapp.enabled=false
notification.whatsapp.api-url=
notification.whatsapp.auth-token=your-whatsapp-token
notification.whatsapp.from=

server.error.include-message=always
server.error.include-stacktrace=always
